services:
  - type: web
    name: data-analysis-tool
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_HISTORY
        value: "10"
      - key: GEMINI_API_KEY
        sync: false
